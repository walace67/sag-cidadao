# SAG-Cidadão completo em contêineres:
#
#   cp .env.docker.example .env.docker      # e preencha
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker ps
#   docker compose --env-file .env.docker logs -f web
#
#   navegador -> nginx (porta 8088) -> web (Gunicorn/Django) -> db (PostgreSQL)
#                                       worker (tarefas em segundo plano)
#
# Os contêineres conversam pela rede interna do Compose, pelo NOME do
# serviço (web, db). Só o Nginx tem porta publicada no host; o banco
# NÃO fica acessível de fora.

x-app: &app
  image: sag-cidadao:latest
  env_file: .env.docker
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    GUNICORN_BIND: "0.0.0.0:8000"
    GUNICORN_UMASK: "0o022"
    STATIC_ROOT: /app/staticfiles
    MEDIA_ROOT: /app/media
    SERVIR_MIDIA_COM_NGINX: "True"
    TASKS_BACKEND: django_tasks_db.DatabaseBackend
    BACKUP_DIR: /backups
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sag_cidadao}
      POSTGRES_USER: ${DB_USER:-sag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env.docker}
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    build: .
    volumes:
      - estaticos:/app/staticfiles
      - fotos:/app/media
      # Só leitura: o monitoramento confere a data do último backup
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Pergunta à própria aplicação se ela e o banco estão bem (/saude/)
      test: ["CMD", "python", "-c", "import urllib.request as u; r=u.Request('http://127.0.0.1:8000/saude/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}); u.urlopen(r, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["python", "manage.py", "db_worker", "--interval", "2"]
    volumes:
      - fotos:/app/media
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Local: http://localhost:8088. No servidor, troque por
      # "127.0.0.1:8088:80" para só o Caddy (HTTPS) alcançar o Nginx.
      - "${PORTA_PUBLICA:-8088}:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - estaticos:/app/staticfiles:ro
      - fotos:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  banco:      # dados do PostgreSQL: sobrevivem a "docker compose down"
  estaticos:
  fotos:      # fotos enviadas (dados pessoais)
