# Integração contínua (CI): a cada push ou pull request, o GitHub cria uma
# máquina limpa com PostgreSQL, instala o projeto e roda os testes.
# Se algo quebrar, o commit fica marcado com um X vermelho.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sag
          POSTGRES_PASSWORD: sag-ci
          POSTGRES_DB: sag_cidadao
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: sag_cidadao
      DB_USER: sag
      DB_PASSWORD: sag-ci
      DB_HOST: localhost
      SECRET_KEY: chave-somente-para-ci
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrações pendentes?
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: python manage.py test
      - name: Verificação de produção
        run: python manage.py check --deploy --fail-level WARNING
        env:
          ALLOWED_HOSTS: sag.exemplo.gov.br
          SECRET_KEY: ci-${{ github.run_id }}-chave-longa-e-aleatoria-o-suficiente-para-o-check-passar-sem-aviso
