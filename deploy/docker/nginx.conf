# Nginx dentro do Docker: proxy reverso para o contêiner "web".
# O HTTPS fica no Caddy, no servidor (ver deploy/PUBLICAR.md).

# Se já veio um X-Forwarded-Proto do Caddy (https), repassa; senão, usa o
# esquema desta conexão (http, no uso local).
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 26m;          # até 3 fotos de 8 MB

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Fotos: só depois que o Django AUTORIZA (X-Accel-Redirect)
    location /midia-protegida/ {
        internal;
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_redirect off;
        proxy_read_timeout 35s;
    }
}
