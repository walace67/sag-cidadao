# Nginx: ENSAIO LOCAL da produção (sem domínio e sem certificado, só HTTP)
#
# No .env do ensaio: DEBUG=False, HTTPS=False, CONFIAR_PROXY=True,
#   GUNICORN_BIND=127.0.0.1:8001, STATIC_ROOT=/var/www/sag-static
#
#   sudo cp deploy/nginx/sag-cidadao-local.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sag-cidadao-local.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Acesse http://localhost

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 2m;

    location /static/ {
        alias /var/www/sag-static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
