# Nginx: proxy reverso do SAG-Cidadão (PRODUÇÃO, com HTTPS)
#
# Instalar:
#   sudo cp deploy/nginx/sag-cidadao.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sag-cidadao.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sag.exemplo.gov.br      # certificado Let's Encrypt
# Troque sag.exemplo.gov.br pelo seu domínio.

upstream sag_app {
    server unix:/run/sag-cidadao/gunicorn.sock;
}

# HTTP (porta 80): só redireciona para HTTPS
server {
    listen 80;
    server_name sag.exemplo.gov.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }  # validação do certbot
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sag.exemplo.gov.br;

    # Preenchido pelo certbot
    ssl_certificate     /etc/letsencrypt/live/sag.exemplo.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sag.exemplo.gov.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;     # TLS 1.0 e 1.1 são inseguros

    server_tokens off;                 # não anuncia a versão do Nginx
    client_max_body_size 26m;          # até 3 fotos de 8 MB por envio

    # Arquivos estáticos (collectstatic) servidos direto, sem passar pelo Python
    # Fotos: só o Nginx lê esta pasta, e só quando o Django AUTORIZA
    # (cabeçalho X-Accel-Redirect). "internal" impede acesso direto pela URL.
    location /midia-protegida/ {
        internal;
        alias /srv/sag_cidadao/media/;
    }

    location /static/ {
        alias /srv/sag_cidadao/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://sag_app;
        proxy_set_header Host $host;
        # IP real do cliente: o Nginx ACRESCENTA o endereço de quem conectou.
        # O Django (CONFIAR_PROXY=True) lê o ÚLTIMO item desta lista.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # avisa ao Django que era HTTPS
        proxy_redirect off;
        proxy_read_timeout 35s;
    }
}
