{% extends "atendimento/base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<h1>Alterar senha</h1>
<div class="card" style="max-width:520px">
  <form method="post">{% csrf_token %}
    {% for campo in form %}{{ campo.label_tag }} {{ campo }} {{ campo.errors }}{% endfor %}
    <p><button class="btn" type="submit">Alterar senha</button></p>
  </form>
</div>
{% endblock %}
